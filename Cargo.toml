[workspace]
resolver = "2"
members = [
    "crates/aperture-core",
    "crates/aperture-limiter",
    "crates/aperture-breaker",
    "crates/aperture-bulkhead",
    "crates/aperture-adaptive",
    "crates/aperture-metrics",
    "crates/aperture-server",
    "crates/aperture-client",
    "crates/aperture-cli",
]
default-members = ["crates/aperture-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/arjunnt666/aperture"
authors = ["Arjun NT"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
